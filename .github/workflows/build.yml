name: build-db
on:
  push:
    paths: ['words.txt', 'build_db.py']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 build_db.py words.txt data.json
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          if ! git diff --cached --quiet; then
            git commit -m "rebuild data.json"
            git push
          fi
